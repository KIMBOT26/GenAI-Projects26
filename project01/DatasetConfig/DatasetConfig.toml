# =======================================================
# Global Settings
# =======================================================
[general]
enable_bucket = true
resolution = [1024, 1024]
batch_size = 2
caption_extension = ".txt"

# =======================================================
# Dataset 1: Your Main Training Data
# =======================================================
[[datasets]]
batch_size = 1

  # Subset 1: The actual training images
  [[datasets.subsets]]
  image_dir = "/your/path/sd-scripts/dataset/10_UweHahne" #Change this path to match yours
  num_repeats = 10
  keep_tokens = 1
  class_tokens = "YourTriggerWord"   # Change token to be your Triggerword